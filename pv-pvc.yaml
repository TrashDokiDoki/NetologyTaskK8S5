apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tmp/netology-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-pvc
spec:
  storageClassName: ""
  volumeName: local-pv
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      containers:
        - name: busybox
          image: busybox
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                echo "$(date)" >> /shared/data.txt
                sleep 5
              done
          volumeMounts:
            - name: persistent-data
              mountPath: /shared

        - name: multitool
          image: wbitt/network-multitool:latest
          volumeMounts:
            - name: persistent-data
              mountPath: /shared

      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: local-pvc
